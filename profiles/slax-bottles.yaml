apiVersion: slax-kitchen/v1
kind: Profile
metadata:
  name: slax-bottles
  summary: 64-bit Slax with Bottles baked in -- boots BIOS and UEFI, no browser
base:
  # 64-bit only, because Bottles exists only as an x86_64 Flatpak.
  # See docs/DECISIONS.md D-14.
  flavour: debian
  arch: 64bit
  version: "12.2.0"
recipes:
  # A DIFFERENT SYSTEM from the slax32-wine and slax64-wine images, not a variant of them.
  # There is no Debian Wine here: Bottles is sandboxed and brings its own runners, so it
  # could not use it. ci/checks/96 section 5(b), which holds the slax-wine recipe lists to
  # one another, deliberately does not compare this profile. Section 5(a3) does hold it
  # to removal-first.
  #
  # REMOVAL FIRST, for the same reason as in the slax-wine profiles: a bundle is built
  # against everything below it, so build 20-flatpak before dropping 05-chromium and apt
  # could satisfy a dependency from a bundle that then leaves. `drop:` is spelled out
  # rather than inherited -- a profile line that deletes something should say what.
  - name: remove-bundle
    vars: {drop: "^05-chromium\\.sb$"}

  # Firmware: Debian's current firmware packages with their copyright files, and firmware
  # from linux-firmware with its licences, as 09-firmware-debian and 09-firmware-linux
  # (docs/DECISIONS.md D-18). Upstream's recipe, right after the removal, as its cookbook
  # page asks: it builds bundles, and nothing may be removed after one is built.
  - firmware-refresh

  - recipes/available/bottles.yaml
  - recipes/available/slax-bottles-iso.yaml

  # LAST, because boot.uefi generates its GRUB menu by parsing isolinux.cfg, so it must
  # see slax-bottles-iso's automount removal. slax-bottles is one image, built with it;
  # pack.sh keeps the BIOS El Torito entry beside the EFI one, so it boots both ways.
  - uefi-bootable
output:
  # Not used -- build.sh names the output from build.env. See slax32-wine-bios.yaml.
  name: "slax-bottles-{{version}}.iso"
