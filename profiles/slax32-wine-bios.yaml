apiVersion: slax-kitchen/v1
kind: Profile
metadata:
  name: slax32-wine-bios
  summary: 32-bit Slax with Wine and Notepad++, stock bootloader -- BIOS only, no browser
base:
  flavour: debian
  arch: 32bit
  version: "12.2.0"
recipes:
  # THE CORE LIST, and the order it is applied in. Every slax-wine profile carries it:
  # the slax32-wine ones exactly, the slax64-wine ones with notepadpp64 directly after
  # notepadpp32, and the uefi and test ones add `uefi-bootable` last. Gate 96 section 5
  # fails if any of them drift, because six profiles that build one system are exactly
  # the kind of thing that drifts silently.
  #
  # A recipe absent from EVERY profile is never built -- the same gate fails on that too.
  #
  # Paths for OURS, a NAME for THEIRS, and the distinction is mechanical rather than
  # stylistic: name resolution searches the ENGINE's recipes/ directories, so it finds
  # remove-bundle in the submodule and would never find ours, which live in this repo.
  # (remove-bundle is written in the {name, vars} form rather than as a plain string so
  # that `drop:` is stated; both forms resolve by name.) A path resolves from the CURRENT
  # WORKING DIRECTORY (apply.py:3305), which is why build.sh cd's to the repo root before
  # applying.
  #
  # Order matters four times over:
  #   remove-bundle  drops 05-chromium BEFORE anything is built, so apt never builds
  #                  against a bundle that is about to be deleted
  #   wine           the payload, built on the stack the removal leaves
  #   wine-desktop   masks the launcher the removal leaves behind, so it must follow wine
  #   notepadpp32    depends on /etc/profile.d/wine.sh from wine-desktop
  #   slax-wine-iso  boot line and pack hints; last in THIS profile
  #
  # REMOVAL FIRST, AND IT MUST BE A RECIPE OF ITS OWN. lib/validate.py refuses a recipe
  # that mixes `bundle.remove` with anything additive, so the browser removal that used to
  # live inside wine.yaml is now upstream's `remove-bundle`, listed here. Its default
  # `drop:` is already `^05-chromium\.sb$` -- we override nothing.
  #
  # It goes FIRST because a bundle is built against everything below it: build 20-wine
  # before dropping 05-chromium and apt links libwine against that bundle's libpulse0,
  # which then leaves with it. check_plan_order refuses that order outright; this listing
  # is what makes the plan legal in the first place.
  #
  # A BARE NAME, resolved from the engine's own recipes/ -- nothing to vendor or re-sync.
  #
  # `drop:` IS SPELLED OUT even though it restates the recipe's own default, and that is
  # this repo's standing rule for a default that decides what ships (see wine.yaml's apt
  # keys, kept explicit for the same reason). This one decides which 81.7 MiB leaves the
  # image: if a later pin changed remove-bundle's default, a bare name would silently
  # change what our ISO deletes, and no gate here could see it. It is upstream's own
  # convention too -- all four of their profiles spell it out, and profiles/minimal.yaml
  # gives the reason: "a profile line that deletes something should say what."
  - name: remove-bundle
    vars: {drop: "^05-chromium\\.sb$"}

  - recipes/available/wine.yaml
  - recipes/available/wine-desktop.yaml
  - recipes/available/notepadpp32.yaml
  - recipes/available/slax-wine-iso.yaml
output:
  # Not used: build.sh names the output from build.env, because {{version}} here means
  # the SLAX version (12.2.0), not ours. Present so the profile is complete and
  # `kitchen build` would produce something sane if anyone ran it.
  name: "slax32-wine-bios-{{version}}.iso"
