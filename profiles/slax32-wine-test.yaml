apiVersion: slax-kitchen/v1
kind: Profile
metadata:
  name: slax32-wine-test
  summary: slax32-wine-uefi plus serial-console and testkit -- built to be asserted against, never shipped
base:
  flavour: debian
  arch: 32bit
  version: "12.2.0"
recipes:
  # NOT A SHIPPED IMAGE. This exists so `kitchen test` has something of OURS to assert
  # against: it carries remove-bundle plus the same recipes as the shipped slax32-wine
  # pair, so the thing under test is OUR image rather than a stock one, plus two things
  # the shipped images must not have (serial-console, testkit) and uefi-bootable.
  # ci/checks/96 §5(b) holds its recipes/available list to slax32-wine-bios's; the three
  # extras are upstream's and named, not pathed, so that comparison does not see them.
  # The removal-first check, §5(a3), covers only the SHIPPED profiles; this one is held
  # to the same order by the engine itself, which refuses any plan where a removal
  # follows something that builds.
  #
  # ORDER IS LOAD-BEARING IN BOTH DIRECTIONS HERE. Read the two notes below before
  # moving anything; getting either backwards does not fail, it quietly tests nothing.

  # FIRST, and this is the one that is easy to get wrong.
  #
  # serial-console adds the only boot entry carrying `console=ttyS0`, and without such an
  # entry the whole exercise is pointless: _serial_keys in lib/build.sh derives its menu
  # keystrokes by searching for `console=ttyS`, finds nothing, and the harness falls back
  # to SCREENSHOT ONLY -- it boots, asserts nothing, and says so. Upstream ran four CI
  # passes in that state believing they were checked.
  #
  # But its append line HARDCODES `automount` (the `append:` in the engine's
  # recipes/available/serial-console.yaml).
  # So it must come BEFORE slax-wine-iso, whose `boot.cmdline remove: [automount]` strips
  # the flag from every APPEND line in both configs. Put serial-console after it and the
  # serial entry -- the only entry any boot test actually selects -- would be the one
  # entry that still had automount, and the probe below would report a failure that is an
  # artefact of recipe order rather than of the image.
  #
  # WORKAROUND https://github.com/Fullaxx/slax-kitchen/issues/50 -- the order is the
  # workaround. #50 asks for a serial entry that carries the image's own command line in
  # any order. If upstream does that, the order stops mattering and this note goes.
  - serial-console

  # REMOVAL FIRST, AND IT MUST BE A RECIPE OF ITS OWN. lib/validate.py refuses a recipe
  # that mixes `bundle.remove` with anything additive, so the browser removal that used to
  # live inside wine.yaml is now upstream's `remove-bundle`, listed here. Its default
  # `drop:` is already `^05-chromium\.sb$` -- we override nothing.
  #
  # It goes BEFORE ANYTHING THAT BUILDS, because a bundle is built against everything
  # below it: build 20-wine before dropping 05-chromium and apt links libwine against
  # that bundle's libpulse0, which then leaves with it. check_plan_order refuses that
  # order outright; this listing is what makes the plan legal in the first place.
  #
  # It is SECOND here rather than first, and that is legal for a specific reason: the
  # rule is removal-before-building, not removal-first-in-the-file. serial-console above
  # edits isolinux.cfg/syslinux.cfg and builds no bundle, so it is not something the
  # removal has to precede. The shipped profiles have nothing before it, which is why
  # ci/checks/96 §5(a3) can hold THEM to the stricter literal form.
  #
  # A BARE NAME, resolved from the engine's own recipes/ -- nothing to vendor or re-sync.
  #
  # `drop:` IS SPELLED OUT even though it restates the recipe's own default, and that is
  # this repo's standing rule for a default that decides what ships (see wine.yaml's apt
  # keys, kept explicit for the same reason). This one decides which 81.7 MiB leaves the
  # image: if a later pin changed remove-bundle's default, a bare name would silently
  # change what our ISO deletes, and no gate here could see it. It is upstream's own
  # convention too -- all four of their profiles spell it out, and profiles/minimal.yaml
  # gives the reason: "a profile line that deletes something should say what."
  - name: remove-bundle
    vars: {drop: "^05-chromium\\.sb$"}

  - recipes/available/wine.yaml
  - recipes/available/wine-desktop.yaml
  - recipes/available/notepadpp32.yaml
  - recipes/available/slax-wine-iso.yaml

  # testkit prints facts about the ASSEMBLED union to the serial console just before
  # change_root, from a rootcopy.preinit hook. It builds no bundle, so this image still
  # has the same nine modules as the shipped slax32-wine images.
  #
  # Two jobs:
  #
  # `marker` is the persistence probe. On boot 1 of a pair the file is absent and gets
  # created + synced; on boot 2 it must still be there. That is the whole two-boot
  # assertion. It writes into the UNION, whose writable branch is the perch session when
  # perch is on and tmpfs when it is not -- which is exactly the property INSTALL.md
  # claims and this project has never observed.
  #
  # NOT /root/.wine/... deliberately, tempting though it is: testkit mkdir -p's the
  # parent, and a pre-existing /root/.wine could make Wine treat an empty directory as an
  # already-initialised prefix and skip wineboot. The persistence property is a fact
  # about the writable branch, not about that path, so a neutral file tests the same
  # mechanism without perturbing the thing under test.
  #
  # `report` boot-asserts that our launcher files reached the union. That is one rung
  # BELOW "the tile appears" -- testkit runs before change_root, so there is no X, no
  # Fluxbox and no xlunch to ask -- but it is the half a machine can check, and it is the
  # half that C1 (upstream #17) silently broke.
  - name: testkit
    vars:
      marker: /var/lib/slax-wine-perch-marker
      report: >-
        /usr/local/bin/slax-wine /usr/local/bin/notepadpp32
        /usr/share/applications/5wine.desktop
        /usr/share/applications/7notepadpp32.desktop
        /etc/profile.d/wine.sh /etc/slax-wine-release
        /opt/notepadpp32/npp32-installer.exe

  # DO NOT ADD /media TO THAT LIST. It was there for one build, as a probe for whether
  # `automount` had been removed -- fstab_create returns early without it and only past
  # that point does it `mkdir -p /media/<dev>`, and /media is in no bundle. The mechanism
  # is real; the probe is not.
  #
  # Measured 2026-09-18: a --kernel boot whose cmdline DID carry automount still reported
  # `file /media: absent`, because fstab_create only creates a mountpoint for a device
  # that is not the boot device, and a plain boot has only the CD. So /media reads
  # `absent` on every route whether or not the flag is there -- a check that always says
  # "pass". It was the positive control that caught this, which is the whole argument for
  # having one.
  #
  # The automount claim is asserted where it actually lives: the `Kernel command line:`
  # line of the serial log. See docs/50-cookbook/slax-wine-iso.md. Grep that line
  # specifically -- systemd logs an unrelated "Set up automount ... Automount Point" later
  # in the same log, which a naive grep counts.

  # LAST, because boot.uefi generates its GRUB menu by PARSING slax/boot/isolinux.cfg --
  # so it has to run after serial-console has added its entry and after slax-wine-iso has
  # edited every entry. Order it earlier and the GRUB menu would be a snapshot of a
  # config that no longer exists, which is the failure mode upstream's own cookbook page
  # warns about.
  #
  # menu_timeout is left at uefi-bootable's shipped default of 5, NOT raised to the 30
  # that profiles/boot-matrix.yaml uses, so the GRUB configuration we actually SHIP is the
  # one tested. Under KVM the harness's own keystrokes select the serial entry. Under TCG
  # they miss it: a fixed 2 s lead (_serial_keys, lib/build.sh), and when GRUB's menu
  # appears depends on the host -- 3.2 s on the build host, 6.9 s with its vCPU starved.
  # So pass --keys: `home` once a second for 24 presses, which holds the menu whenever it
  # comes, then down,down,ret. The command is in docs/50-cookbook/slax-wine-iso.md, and
  # the measurements in docs/UPSTREAM.md. On a KVM host none of this is needed: the menu
  # is up in about a second and the harness's own keys select the serial entry.
  - uefi-bootable
output:
  name: "slax32-wine-test-{{version}}.iso"
