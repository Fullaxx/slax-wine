# Build, test and stage a slax-wine release, from a pushed tag, into a DRAFT release.
#
# docs/build.md "Cutting a release" is the procedure this is one step of, and
# docs/DECISIONS.md D-19 is why it looks like this. In short:
#
#   git push origin v1.0.0      guard -> gates + three build jobs -> finish
#                               = a draft release holding all 32 assets and its notes.
#                               A person reads the draft and publishes it. Nothing here
#                               publishes.
#   workflow_dispatch (tag)     the same run from a branch, into a draft named
#                               <tag>-rehearsal.<run>, which is deleted afterwards. A tag
#                               push happens once; this is how the path is exercised first.
#
# The work is in ci/release-*.sh, which a person can run by hand too; this file only
# orders it. Modelled on slax-kitchen's own release.yml (vendor/slax-kitchen/.github/):
#
#   - action versions are its Node 24 floor, checked there against each action.yml:
#     checkout v7, cache v6, upload-artifact v7. No release action: `gh` is preinstalled
#     and adds nothing new to trust.
#   - inputs reach scripts through env:, never ${{ }} inside run:, so a tag holding shell
#     metacharacters cannot execute.
#   - `shell: bash` below makes every step `bash -eo pipefail`; GitHub's default is
#     `bash -e`, whose pipelines exit with their last command's status.
#   - no pull_request trigger: fork code never reaches a job that can write a release.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag to rehearse, e.g. v1.0.0 (must be v + build.env's VERSION)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GH_REPO: ${{ github.repository }}

jobs:
  # ----------------------------------------------------------------- guard --
  # Seconds, ahead of the builds: the tag, the version and the CHANGELOG agree, and
  # the commit is on master. Then the draft every later job uploads to.
  guard:
    name: release guard
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.draft.outputs.release }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The guard compares against origin/master, which a depth-1 clone does not have.
          fetch-depth: 0
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = push ]; then tag=$PUSH_TAG; else tag=$INPUT_TAG; fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(sed -n 's/^VERSION=//p' build.env | head -1)" >> "$GITHUB_OUTPUT"
      - name: tag, version and CHANGELOG agree
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if [ "$EVENT" = push ]; then
            ./ci/release-guard.sh "$TAG" --tag-push
          else
            ./ci/release-guard.sh "$TAG"
          fi
      - id: draft
        name: create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$EVENT" = push ]; then rel=$TAG; else rel="$TAG-rehearsal.$RUN_NUMBER"; fi
          # A draft left by a failed run is reused (every upload is --clobber); a published
          # release is never touched.
          state=$(gh release view "$rel" --json isDraft -q .isDraft 2>/dev/null || echo none)
          case "$state" in
            true)  echo "::notice::reusing the draft $rel" ;;
            false) echo "::error::$rel is already published; nothing here changes a published release"
                   exit 1 ;;
            *)     if [ "$EVENT" = push ]; then
                     gh release create "$rel" --draft --verify-tag --title "slax-wine $VERSION" \
                       --notes "Being built by $RUN_URL. Not finished until SHA256SUMS is attached."
                   else
                     # No tag is created: a draft's tag only comes into being when it is
                     # published, and a rehearsal draft never is.
                     gh release create "$rel" --draft --prerelease --target "$SHA" \
                       --title "slax-wine $VERSION (rehearsal $RUN_NUMBER)" \
                       --notes "Rehearsal by $RUN_URL. Do not publish; delete it when done."
                   fi ;;
          esac
          printf 'release=%s\n' "$rel" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------- gates --
  # Every commit gate, in tree scope. On a tag push, gate 96 section 6 also holds the tag to
  # the version and refuses a TBD-MEASURED left in the docs.
  gates:
    name: commit gates
    runs-on: ubuntu-24.04
    needs: guard
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: install lint tooling
        run: |
          sudo apt-get update -qq
          grep -v -e '^#' -e '^$' vendor/slax-kitchen/containers/packages/lint.txt \
            | xargs sudo apt-get install -y --no-install-recommends
      - run: ./ci/run-checks.sh ci

  # ----------------------------------------------------------------- build --
  # One job per base: its shipped images and its test image, the test image booted through
  # all four routes, and the shipped images' assets uploaded to the draft.
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: guard
    timeout-minutes: 240
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # kvm: false for the 32-bit guest. Measured in the first rehearsal (run 36560764961):
          # under the runner's KVM, all four routes stopped right after "Live Kit init" and ran
          # out a 600 s ceiling, while the same image boots under KVM on the boot host, and the
          # 64-bit images booted under the runner's KVM (docs/measurements.md#boot-runner-32-kvm,
          # #boot-kvm, #boot-runner-kvm). The cause is not established.
          # This project's 32-bit boots ran under TCG for weeks before a KVM host existed.
          - name: slax32-wine
            kvm: false
            args: --32 --both
            test_args: --32 --test
            images: slax32-wine-bios slax32-wine-uefi
            test: slax32-wine-test
          - name: slax64-wine
            kvm: true
            args: --64 --both
            test_args: --64 --test
            images: slax64-wine-bios slax64-wine-uefi
            test: slax64-wine-test
          - name: slax-bottles
            kvm: true
            args: --bottles
            test_args: --bottles-test
            images: slax-bottles
            test: slax-bottles-test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # A hosted runner promises about 14 GB free, and slax-bottles alone stages its Flatpak
      # and packs two ISOs (docs/measurements.md#disk-stage, #iso-slax-bottles). Once the
      # runner's preinstalled SDKs are gone, which are none of ours, it has far more
      # (docs/measurements.md#runner-disk).
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL
          df -h / /mnt 2>/dev/null || df -h /

      # The work tree and the ISOs go on whichever filesystem has more room.
      - name: choose where to build
        run: |
          root=$(df --output=avail -B1 / | tail -1)
          mnt=$(df --output=avail -B1 /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt:-0}" -gt "$root" ]; then base=/mnt/slax-wine; else base=$RUNNER_TEMP/slax-wine; fi
          sudo mkdir -p "$base"
          sudo chown "$(id -u):$(id -g)" "$base"
          { echo "WORK=$base/work"; echo "OUT=$base/out"; } >> "$GITHUB_ENV"
          echo "building under $base"

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          cat vendor/slax-kitchen/containers/packages/build.txt \
              vendor/slax-kitchen/containers/packages/boot.txt \
            | grep -v -e '^#' -e '^$' \
            | xargs sudo apt-get install -y --no-install-recommends flatpak

      # `kitchen test` uses KVM whenever /dev/kvm is writable, and TCG otherwise. The runners
      # have had one (measured 2026-09-29); a job whose matrix entry says kvm: false keeps it
      # root-only, so its boots run under TCG. Either way, this says which it got, and a job
      # that wants KVM fails here if the device is still not writable after the udev rule,
      # rather than claiming KVM and booting under TCG. slax-kitchen a9008a5 added the same
      # check to its own boot job, which uses this rule.
      - name: KVM, if the runner has it and the job wants it
        env:
          NAME: ${{ matrix.name }}
          WANT_KVM: ${{ matrix.kvm }}
        run: |
          if [ "$WANT_KVM" != true ]; then
            [ ! -e /dev/kvm ] || sudo chmod 0600 /dev/kvm
            echo "::notice::$NAME: boots run under TCG, by choice (kvm: false)"
          elif [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
            ls -l /dev/kvm
            if [ ! -w /dev/kvm ]; then
              echo "::error::$NAME: /dev/kvm is there but still not writable by $(id -un)"
              exit 1
            fi
            echo "::notice::$NAME: /dev/kvm is writable, boots run under KVM"
          else
            echo "::notice::$NAME: no /dev/kvm, boots run under TCG"
          fi

      # The bases never change, and `kitchen fetch` re-verifies size and sha256 either way.
      - uses: actions/cache@v6
        with:
          path: isos/
          key: isos-${{ matrix.name }}-${{ hashFiles('build.env') }}
          restore-keys: isos-${{ matrix.name }}-

      - name: build the shipped images
        env:
          ARGS: ${{ matrix.args }}
        # ARGS is a list of options, split on purpose.
        run: ./build.sh $ARGS

      - name: build the test image
        env:
          ARGS: ${{ matrix.test_args }}
        run: ./build.sh $ARGS

      - name: boot the test image, four routes
        env:
          KITCHEN_BOOT_HOST: local
          TEST: ${{ matrix.test }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: ./ci/release-boot.sh "$OUT/$TEST-$VERSION.iso" --seconds 600 --tcg-keys

      - name: stage and upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: ${{ matrix.images }}
          REL: ${{ needs.guard.outputs.release }}
        run: |
          # IMAGES is a list of image names, split on purpose.
          ./ci/release-stage.sh "$OUT" "$OUT/release" $IMAGES
          gh release upload "$REL" "$OUT"/release/* --clobber
          df -h "$OUT"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-evidence-${{ matrix.name }}
          path: |
            ${{ env.OUT }}/boot-tests/
            ${{ env.OUT }}/*.log
            ${{ env.OUT }}/build-summary-*.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------- finish --
  # SHA256SUMS and the notes, from the small assets only: each ISO's line comes from its
  # .iso.sha256, so nothing large is downloaded again. The draft stays a draft.
  finish:
    name: checksums and notes
    runs-on: ubuntu-24.04
    needs: [guard, gates, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: SHA256SUMS, notes, and a complete count
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
          REL: ${{ needs.guard.outputs.release }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p assets
          gh release download "$REL" -D assets --clobber \
            -p '*.sha256' -p '*.json' -p '*.tsv' -p '*.md' -p '*.txt'
          gh release view "$REL" --json assets -q '.assets[] | "\(.name) \(.size)"' > sizes.txt
          ./ci/release-sums.sh assets --sizes sizes.txt
          gh release upload "$REL" assets/SHA256SUMS --clobber
          ./ci/release-notes.sh "$TAG" assets --sizes sizes.txt --run-url "$RUN_URL" > notes.md
          gh release edit "$REL" --notes-file notes.md
          have=$(gh release view "$REL" --json assets -q '.assets | length')
          want=$(./ci/release-sums.sh --list | wc -l)
          if [ "$have" -ne "$want" ]; then
            echo "::error::the draft holds $have assets, a release is $want"
            exit 1
          fi
          echo "::notice::$REL is a complete draft: $have assets. Read it, then publish it by hand."
