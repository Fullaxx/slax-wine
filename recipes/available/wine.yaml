apiVersion: slax-kitchen/v1
kind: Recipe
metadata:
  name: wine
  summary: Install Wine 8.0 from bookworm main, and drop Chromium to pay for its size
  tags: [bundle, packages, wine, size]
compat:
  # Debian and 32-bit only, and not a limit we intend to lift. The point of this image is
  # running 32-bit Windows binaries, which is what Debian's i386 wine32 + wine32-preloader
  # do. A 64-bit base would need wine64 plus i386 multiarch -- a larger image and a
  # different project. See docs/DECISIONS.md.
  flavours: [debian]
  arch: [32bit]
  slax: ">=12.2.0 <13.0.0"
  privilege: chroot
vars:
  bundle: 20-wine
steps:
  # THE BROWSER REMOVAL IS NOT HERE ANY MORE, and that is a rule rather than a
  # preference. lib/validate.py (slax-kitchen @ 8adfca6) refuses a recipe that mixes
  # `bundle.remove` with anything that builds:
  #
  #   "a recipe that removes or renumbers a bundle does nothing else. Put the removal in
  #    its own recipe -- remove-bundle takes a `drop:` pattern -- and list that first"
  #
  # This recipe used to do both, and the split is upstream's reasoning, not ours: mixing
  # hides a deletion inside an addition, and the deletion then dictates where the whole
  # recipe may sit. All three profiles now list upstream's `remove-bundle` FIRST, each
  # spelling out `drop: "^05-chromium\.sb$"` -- which restates that recipe's own default
  # on purpose, because a default that decides what ships should not be inherited
  # silently. Same rule as the apt keys below.
  #
  # WHY THE ORDER STILL MATTERS, because nothing in this file shows it any more:
  # `from:` below names its stack explicitly, but the ENGINE DEFAULT is "every bundle
  # that will sit below this one", which for a 20- bundle includes 05-chromium.sb.
  # Building before removing would link against libraries that then leave with the
  # bundle. Measured on this exact base: libpulse0 is a hard Depends of libwine, ABSENT
  # from 01-core..04-apps and PRESENT in 05-chromium.sb -- apt would see it installed,
  # skip it, and the .so would vanish at runtime.
  #
  # check_plan_order enforces removal-first across the whole plan, seeded from the
  # journal so it holds across separate `kitchen apply` invocations (apply.py:254), and
  # --skip-preflight no longer disables it. Issues #1 and #11, both closed.
  #
  # The explicit `from:` compensates for nothing now. It stays as belt-and-braces: it
  # documents the stack, and it holds even on an engine older than the pin. Not free --
  # naming bundles explicitly makes this recipe hard-fail if any of the five is renamed
  # anywhere in the declared slax: range (apply.py:702, "no bundle matching").
  #
  # The size argument for dropping the browser lives in docs/DECISIONS.md D-2 and
  # docs/sizing.md, which carry the measured ledger: 05-chromium.sb is 81.7 MiB against
  # Wine's 166.6 MiB, so it buys half of Wine, not all of it.

  # -- 2. the Wine bundle ------------------------------------------------------------
  #
  # 20- because bundle numbering is slax-kitchen's convention, not upstream Slax's, and
  # it allocates 00-09 to the platform (upstream's 01-06 plus slax-kitchen's own
  # OS-adjusting recipes at 07-09), 10-89 to forks, 90-97 to headroom, and refuses 98
  # (the generated package database) and 99 (savechanges). Within the fork band this
  # project uses 20-29 for its platform and 30-89 for applications, and starts at 20
  # rather than 10 because slax-kitchen's example app recipes occupy the bottom of the
  # band and that set GROWS -- it was 10-12 when this was written and is 10-16 today
  # (chromium, firefox, libreoffice, browsers x2, tor x3). Leaving the low end to them
  # costs nothing and means an upstream example can never collide with ours.
  # See vendor/slax-kitchen/docs/10-anatomy/bundles-squashfs.md.
  #
  # The build root is stacked from the ISO's own bundles, so there is no debootstrap and
  # no external base image, and everything installed matches the shipped kernel's ABI.
  #
  # `from:` stops at 04-apps. That is the whole of the image once step 1 has run, so
  # apt's idea of "already installed" matches the finished ISO exactly.
  - verb: bundle.packages
    bundle: "{{bundle}}"
    from: [01-core, 01-firmware, 02-xorg, 03-desktop, 04-apps]
    # Five packages are the payload; eleven are libwine Recommends named back by hand.
    #
    #   wine              arch-all wrapper; Depends: wine64 | wine32, and i386 picks wine32
    #   wine32            the i386 loader
    #   libwine           the payload: 91 MiB of .deb, 563 MiB installed
    #   wine32-preloader  the prelinked low-address loader old 32-bit Windows programs
    #                     need. NOTHING Depends on it -- it Depends on wine32, not the
    #                     reverse -- so it arrives only if it is named here.
    #   fonts-wine        Wine's core font replacements; only a Recommends, but Wine
    #                     draws boxes without it.
    #
    # The eleven Recommends are dlopen()ed rather than linked, so a missing one does not
    # fail the install -- it silently disables a feature. Measured against this base
    # (docs/DECISIONS.md carries the table): NINE of them are already installed in the
    # base -- eight in 02-xorg.sb and libgnutls30 in 01-core.sb -- so naming them mostly
    # documents the dependency rather than costing bytes.
    #
    # "Mostly", because libgnutls30 is the exception and it is worth knowing why: the
    # base carries 3.7.9-2 and apt UPGRADES it to 3.7.9-2+deb12u7, so it lands in this
    # bundle's dpkg fragment and ships ~3.6 MB of libgnutls.so.30.34.3 plus locale files.
    # Eight are free, three add bytes. It is also why 04-apps' 576 packages plus this
    # fragment's 60 come to 635 and not 636: libgnutls30 is in both, so the fragment adds
    # 59 NEW entries and upgrades one.
    #
    # libwine declares 24 Recommends. Twelve are named above. Of the twelve that are
    # not, these eight are the ones worth knowing about -- each is one `apt install` away
    # at runtime and docs/using-wine.md says what you lose: gstreamer1.0-plugins-good,
    # libvulkan1, libosmesa6, libsdl2-2.0-0, libodbc2, libv4l-0 -- plus libcups2 and
    # libgssapi-krb5-2, which are ALREADY in the base image and so need nothing.
    #
    # The remaining four -- libdbus-1-3, libgl1-mesa-dri, libkrb5-3, libxfixes3 -- are
    # also already present, which is why nothing breaks without naming them. Counted
    # here so this reads as the complete ledger it claims to be: 12 + 8 + 4 = 24.
    #
    # NEVER add ttf-mscorefonts-installer, which libwine Suggests: it is non-free and
    # downloads from a third party during postinst, turning an offline, auditable bundle
    # into a network-dependent one carrying a EULA.
    packages:
      - wine
      - wine32
      - libwine
      - wine32-preloader
      - fonts-wine
      # present already -- free, and they document what Wine reaches for
      - libgl1
      - libgnutls30
      - libxcomposite1
      - libxcursor1
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libxxf86vm1
      # absent -- these are the two Recommends that cost bytes, and both are worth it:
      # without fonts-liberation Windows apps fall back to bitmap fonts, and without
      # libasound2-plugins Wine's ALSA output cannot reach PulseAudio.
      - fonts-liberation
      - libasound2-plugins
    apt:
      # Slax's own 01-core sources.list already points at bookworm main -- verified, it
      # carries `main contrib non-free non-free-firmware` for bookworm, -security and
      # -updates. No extra apt source, no third-party key, no suite mixing.
      #
      # update: true because the stacked root's package index is from October 2023 and
      # covers only bookworm-security. (NOT because of BUNDLE_EXCLUDE: that rule --
      # apply.py:2462, ^var/lib/(apt|slackpkg) -- governs bundles slax-kitchen BUILDS,
      # and this stack is five upstream bundles it never built. 01-core.sb ships 15
      # var/lib/apt/lists entries. The flag is right; the old reason was not.)
      #
      # Both keys below restate engine defaults (apply.py:2711, :2716). Kept explicit
      # because an apt invocation that silently changed either would change what ships.
      update: true
      no_recommends: true
