apiVersion: slax-kitchen/v1
kind: Recipe
metadata:
  name: wine
  summary: Install Wine 8.0 from bookworm main
  tags: [bundle, packages, wine, size]
compat:
  # Both bases: slax-wine is built on each (docs/DECISIONS.md D-16). Two steps below build
  # the same 20-wine bundle, one per base, each guarded by `when: arch==...`, so exactly
  # one of them runs.
  flavours: [debian]
  arch: [32bit, 64bit]
  slax: ">=12.2.0 <13.0.0"
  privilege: chroot
vars:
  bundle: 20-wine
steps:
  # THE BROWSER REMOVAL IS NOT HERE ANY MORE, and that is a rule rather than a
  # preference. lib/validate.py (slax-kitchen @ 8adfca6) refuses a recipe that mixes
  # `bundle.remove` with anything that builds:
  #
  #   "a recipe that removes or renumbers a bundle does nothing else. Put the removal in
  #    its own recipe -- remove-bundle takes a `drop:` pattern -- and list that first"
  #
  # This recipe used to do both, and the split is upstream's reasoning, not ours: mixing
  # hides a deletion inside an addition, and the deletion then dictates where the whole
  # recipe may sit. Every profile that applies this recipe lists upstream's
  # `remove-bundle` before anything that builds, each spelling out
  # `drop: "^05-chromium\.sb$"` -- which restates that recipe's own default on purpose,
  # because a default that decides what ships should not be inherited silently. Same rule
  # as the apt keys below.
  #
  # WHY THE ORDER STILL MATTERS, because nothing in this file shows it any more: the
  # build below takes the ENGINE DEFAULT for `from:`, "every bundle that will sit below
  # this one", which for a 20- bundle would include 05-chromium.sb if it were still
  # there. Building before removing would link against libraries that then leave with
  # the bundle. Measured on the 32-bit base: libpulse0 is a hard Depends of libwine,
  # ABSENT from 01-core..04-apps and PRESENT in 05-chromium.sb -- apt would see it
  # installed, skip it, and the .so would vanish at runtime. The 64-bit base has the
  # same shape: libpulse0 is absent from its 01-core..04-apps too.
  #
  # Two guards hold the order. check_plan_order refuses a removal that follows a build,
  # across the whole plan and seeded from the journal so it holds across separate
  # `kitchen apply` invocations (apply.py:254), and --skip-preflight no longer disables
  # it -- issues #1 and #11, both closed. And ci/checks/96-release-consistency.sh
  # §5(a3) refuses a shipped profile that lists remove-bundle late.
  #
  # This recipe used to name its stack as a third guard, and stopped at the 3a44e8a bump
  # (docs/DECISIONS.md D-3): the named list protected nothing the two above do not, and
  # it had a cost of its own. A stack named by hand goes stale the moment a bundle is
  # added below 20, and apt then reinstalls libraries the image already has.
  #
  # The size argument for dropping the browser lives in docs/DECISIONS.md D-2 and
  # docs/sizing.md, which carry the measured ledger: 05-chromium.sb is 81.7 MiB against
  # Wine's 166.6 MiB on the 32-bit base, so it buys half of Wine, not all of it.

  # -- 2. the Wine bundle, 32-bit base ----------------------------------------------
  #
  # 20- because bundle numbering is slax-kitchen's convention, not upstream Slax's, and
  # it allocates 00-09 to the platform (upstream's 01-06 plus slax-kitchen's own
  # OS-adjusting recipes at 07-09), 10-89 to forks, 90-97 to headroom, and refuses 98
  # (the generated package database) and 99 (savechanges). Within the fork band this
  # project uses 20-29 for its platform and 30-89 for applications, and starts at 20
  # rather than 10 because slax-kitchen's example app recipes occupy the bottom of the
  # band and that set GROWS -- it was 10-12 when this was written and is 10-16 today
  # (chromium, firefox, libreoffice, browsers x2, tor x3). Leaving the low end to them
  # costs nothing and means an upstream example can never collide with ours.
  # See vendor/slax-kitchen/docs/10-anatomy/bundles-squashfs.md.
  #
  # The build root is stacked from the ISO's own bundles, so there is no debootstrap and
  # no external base image, and everything installed matches the shipped kernel's ABI.
  #
  # The default stack is 01-core..04-apps once remove-bundle has run: the whole of the
  # finished image below 20, so apt's idea of "already installed" matches the ISO exactly.
  - verb: bundle.packages
    when: arch==32bit
    bundle: "{{bundle}}"
    # Five packages are the payload; eleven are libwine Recommends named back by hand.
    #
    #   wine              arch-all wrapper; Depends: wine64 | wine32, and i386 picks wine32
    #   wine32            the i386 loader
    #   libwine           the payload: 91 MiB of .deb, 563 MiB installed
    #   wine32-preloader  the prelinked low-address loader old 32-bit Windows programs
    #                     need. NOTHING Depends on it -- it Depends on wine32, not the
    #                     reverse -- so it arrives only if it is named here.
    #   fonts-wine        Wine's core font replacements; only a Recommends, but Wine
    #                     draws boxes without it.
    #
    # The eleven Recommends are dlopen()ed rather than linked, so a missing one does not
    # fail the install -- it silently disables a feature. Measured against this base
    # (docs/DECISIONS.md carries the table): NINE of them are already installed in the
    # base -- eight in 02-xorg.sb and libgnutls30 in 01-core.sb -- so naming them mostly
    # documents the dependency rather than costing bytes.
    #
    # "Mostly", because libgnutls30 is the exception and it is worth knowing why: the
    # base carries 3.7.9-2 and apt UPGRADES it to 3.7.9-2+deb12u7, so it lands in this
    # bundle's dpkg fragment and ships ~3.6 MB of libgnutls.so.30.34.3 plus locale files.
    # Eight are free, three add bytes. It is also why 04-apps' 576 packages plus this
    # fragment's 60 come to 635 and not 636: libgnutls30 is in both, so the fragment adds
    # 59 NEW entries and upgrades one.
    #
    # libwine declares 24 Recommends. Twelve are named above. Of the twelve that are
    # not, these eight are the ones worth knowing about -- each is one `apt install` away
    # at runtime and docs/using-wine.md says what you lose: gstreamer1.0-plugins-good,
    # libvulkan1, libosmesa6, libsdl2-2.0-0, libodbc2, libv4l-0 -- plus libcups2 and
    # libgssapi-krb5-2, which are ALREADY in the base image and so need nothing.
    #
    # The remaining four -- libdbus-1-3, libgl1-mesa-dri, libkrb5-3, libxfixes3 -- are
    # also already present, which is why nothing breaks without naming them. Counted
    # here so this reads as the complete ledger it claims to be: 12 + 8 + 4 = 24.
    #
    # NEVER add ttf-mscorefonts-installer, which libwine Suggests: it is non-free and
    # downloads from a third party during postinst, turning an offline, auditable bundle
    # into a network-dependent one carrying a EULA.
    packages:
      - wine
      - wine32
      - libwine
      - wine32-preloader
      - fonts-wine
      # present already -- free, and they document what Wine reaches for
      - libgl1
      - libgnutls30
      - libxcomposite1
      - libxcursor1
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libxxf86vm1
      # absent -- these are the two Recommends that cost bytes, and both are worth it:
      # without fonts-liberation Windows apps fall back to bitmap fonts, and without
      # libasound2-plugins Wine's ALSA output cannot reach PulseAudio.
      - fonts-liberation
      - libasound2-plugins
    apt:
      # Slax's own 01-core sources.list already points at bookworm main -- verified, it
      # carries `main contrib non-free non-free-firmware` for bookworm, -security and
      # -updates. No extra apt source, no third-party key, no suite mixing.
      #
      # update: true because the stacked root's package index is from October 2023 and
      # covers only bookworm-security. (NOT because of BUNDLE_EXCLUDE: that rule --
      # apply.py:2462, ^var/lib/(apt|slackpkg) -- governs bundles slax-kitchen BUILDS,
      # and this stack is five upstream bundles it never built. 01-core.sb ships 15
      # var/lib/apt/lists entries. The flag is right; the old reason was not.)
      #
      # Both keys below restate engine defaults (apply.py:2711, :2716). Kept explicit
      # because an apt invocation that silently changed either would change what ships.
      update: true
      no_recommends: true

  # -- 3. the Wine bundle, 64-bit base ----------------------------------------------
  #
  # The same Wine, 8.0~repack-4 from bookworm main, in its two halves: wine64 runs 64-bit
  # Windows programs, and wine32 -- an i386 package, hence the foreign architecture
  # below -- runs 32-bit ones, each in a separate 32-bit Linux process. The 64-bit Slax
  # kernel runs those: its embedded config has IA32_EMULATION=y, MODIFY_LDT_SYSCALL=y and
  # X86_16BIT=y (read from /slax/boot/vmlinuz's IKCONFIG, docs/DECISIONS.md D-16).
  #
  # EVERY HALF IS NAMED, because Debian makes most of them optional:
  #
  #   wine                   arch-all wrapper; Depends: wine64 | wine32
  #   wine64                 the 64-bit loader
  #   wine64-preloader       only a Suggests of wine64
  #   libwine                the 64-bit payload
  #   wine32:i386            only a RECOMMENDS of wine64. Without it this image runs no
  #                          32-bit Windows program at all, and no_recommends would drop
  #                          it silently -- so build.sh refuses an image whose package
  #                          list lacks it.
  #   wine32-preloader:i386  as in the 32-bit step: nothing Depends on it
  #   libwine:i386           the 32-bit payload
  #   fonts-wine             arch-all
  #
  # THE RECOMMENDS, TWICE. The amd64 list is the 32-bit step's, name for name: the 64-bit
  # base has exactly the 32-bit base's set of them -- measured, the same nine present and
  # the same absentees (libpulse0, fonts-liberation, libasound2-plugins, libvulkan1). The
  # :i386 list gives 32-bit programs what the 32-bit image gives them natively: the ten
  # arch-specific names from that list, plus the six the 32-bit base carries without
  # naming them (libgl1-mesa-dri, libdbus-1-3, libkrb5-3, libxfixes3, libcups2,
  # libgssapi-krb5-2). libpulse0:i386 arrives as a hard Depends of libwine:i386.
  #
  # NEVER :i386 ON AN ARCH-ALL PACKAGE (wine, fonts-wine, fonts-liberation). After the
  # install the engine checks every name with `dpkg-query -W <name as written>`
  # (apply.py:2913), and an arch-all package is not found as :i386, so the step would
  # fail after a successful install.
  #
  # LOCKSTEP. A Multi-Arch: same library must be the same version on both architectures.
  # The base's amd64 libraries date from October 2023 and apt installs today's i386 ones,
  # so apt lifts each amd64 twin to match, and those upgraded amd64 packages ship in this
  # bundle. docs/DECISIONS.md D-16 lists them, measured.
  - verb: bundle.packages
    when: arch==64bit
    bundle: "{{bundle}}"
    packages:
      - wine
      - wine64
      - wine64-preloader
      - libwine
      - wine32:i386
      - wine32-preloader:i386
      - libwine:i386
      - fonts-wine
      # amd64: the 32-bit step's Recommends, name for name
      - libgl1
      - libgnutls30
      - libxcomposite1
      - libxcursor1
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libxxf86vm1
      - fonts-liberation
      - libasound2-plugins
      # i386: the same, for 32-bit programs
      - libgl1:i386
      - libgnutls30:i386
      - libxcomposite1:i386
      - libxcursor1:i386
      - libxi6:i386
      - libxinerama1:i386
      - libxrandr2:i386
      - libxrender1:i386
      - libxxf86vm1:i386
      - libasound2-plugins:i386
      # i386: what the 32-bit base carries without naming it
      - libgl1-mesa-dri:i386
      - libdbus-1-3:i386
      - libkrb5-3:i386
      - libxfixes3:i386
      - libcups2:i386
      - libgssapi-krb5-2:i386
    apt:
      # `dpkg --add-architecture i386` before the index refresh. /var/lib/dpkg/arch ships
      # in this bundle (slax-kitchen docs/90-reference/verbs.md), so the booted system
      # knows the architecture too, and `apt install foo:i386` works there.
      architectures: [i386]
      # The same two keys, for the same reason, as the 32-bit step.
      update: true
      no_recommends: true
