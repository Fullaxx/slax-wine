apiVersion: slax-kitchen/v1
kind: Recipe
metadata:
  name: slax-bottles-iso
  summary: Boot defaults, ISO identity and a checksum beside the image -- for slax-bottles
  tags: [boot, iso, release]
compat:
  flavours: [debian]
  arch: [64bit]
  slax: ">=12.2.0 <13.0.0"
  privilege: none
steps:
  # slax-wine-iso.yaml's first and last steps, copied rather than shared. That recipe is
  # the slax-wine images' own -- it carries one identity step per base for them -- and
  # slax-bottles is another product; sharing would have meant a branch for it in a recipe
  # four shipped images depend on, to save two short steps. Upstream's iso-identity was
  # considered too: it has no appid, and its fixed `preparer: slax-kitchen` would drop the
  # Slax credit. Its sibling boot-cmdline appends `toram`, which is wrong for a 1.2 GiB
  # image. If these two steps ever change in slax-wine-iso.yaml, change them here too.
  #
  # Remove `automount`; do not negate it. fstab_create tests `grep -vq automount
  # /proc/cmdline`, and `noautomount` contains `automount`. See slax-wine-iso.yaml.
  - verb: boot.cmdline
    remove:
      - automount

  # The volid is the label people see when the image is mounted or written to a stick.
  # build.sh reads it back from the pack hints for iso_assert.py --volid. No version
  # string here: build.sh passes it to `kitchen pack --appid`, where the flag wins.
  #
  # Must run BEFORE uefi-bootable, whose GRUB menu is generated by parsing isolinux.cfg,
  # so that it sees the automount removal above. The two recipes write different pack
  # hint keys, so the order has no other effect.
  - verb: iso.metadata
    volid: SLAX-BOTTLES
    appid: "slax-bottles (github.com/Fullaxx/slax-wine)"
    publisher: "Brett Kuskie -- github.com/Fullaxx/slax-wine"
    preparer: "slax-kitchen; Slax by Tomas Matejicek, see NOTICE.md"

  # After mastering, because an image cannot contain its own checksum. Unsigned, for the
  # reason given in slax-wine-iso.yaml.
  - verb: iso.checksums
    algorithm: sha256
