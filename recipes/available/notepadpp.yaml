apiVersion: slax-kitchen/v1
kind: Recipe
metadata:
  name: notepadpp
  summary: Ship the Notepad++ installer as the swappable application layer
  tags: [bundle, app, wine]
compat:
  flavours: [debian]
  arch: [32bit]
  slax: ">=12.2.0 <13.0.0"
  privilege: none
  # The launcher below calls /usr/local/bin/slax-wine, which 21-wine-desktop supplies.
  # Stating it in prose was not enough: `kitchen apply notepadpp` on its own happily
  # built a bundle whose launcher pointed at a wrapper that was not in the image.
  # resolve() walks this list before applying (apply.py:2868), so the dependency is now
  # real rather than documentary.
  #
  # PATHS, not bare names. Bare-name resolution searches the ENGINE's recipes/
  # directories plus the current working directory (apply.py:2842), and ours live in this
  # repo -- so a bare "wine-desktop" would not be found. build.sh cd's to the repo root
  # for exactly this reason.
  requires:
    - recipes/available/wine-desktop.yaml
vars:
  bundle: 30-notepadpp
steps:
  # THE SWAPPABLE LAYER. Bundle numbering is the mechanism, not a naming convention:
  # load order is the numeric prefix, higher wins, and union_append_bundles inserts each
  # bundle at aufs branch index 1 so each arrival outranks the last. Delete this one
  # file from /slax/modules/ on a stick and drop another 30-*.sb in its place -- no
  # rebuild, no remaster -- or swap it live with `slax activate`.
  #
  # 30 because this project uses 20-29 for its platform (20-wine, 21-wine-desktop) and
  # 30-89 for applications, inside the 10-89 band slax-kitchen allocates to forks.
  #
  # This bundle DEPENDS on 21-wine-desktop, which supplies /usr/local/bin/slax-wine.
  # That is correct and deliberate: 20+21 are the platform, 30 is an app on it.
  #
  # Notepad++ is a smoke test, not a proof. It exercises PE loading, the NSIS runtime,
  # registry writes, file creation in the prefix and the common-controls GUI. It does
  # NOT exercise DirectDraw/Direct3D, DirectSound, MSI or 16-bit code -- which for an
  # old game are precisely the risky parts. docs/using-wine.md says so plainly.
  #
  # The payload is fetched and verified by build.sh, not committed: APP_URL,
  # APP_SHA256 and APP_VERSION in build.env, staged under the stable name
  # npp-installer.exe so updating Notepad++ is THREE edits there and nothing here
  # changes. APP_VERSION is not decorative: build.sh writes it into
  # /opt/notepadpp/VERSION inside the ISO, so leaving it behind ships an image that
  # misreports its own application version.
  #
  # ONE bundle, one step. bundle.files takes a directory for `src:` and copies it
  # recursively, so the payload and the two launcher files go in together -- a bundle
  # name can only be produced once, and a second step targeting the same name is refused
  # (correctly: two steps silently overwriting each other is how a bundle ends up with
  # only half of what the recipe says).
  #
  # The launcher lives HERE rather than in 21-wine-desktop, so swapping the app bundle
  # swaps its launcher too. That property is what makes a games variant a file swap.
  #
  # `src:` resolves against this recipe's own directory, so the staging dir travels with
  # the recipe. build.sh populates it; it is gitignored.
  - verb: bundle.files
    bundle: "{{bundle}}"
    files:
      - dest: /opt/notepadpp
        src: ./notepadpp.files/opt/notepadpp

      # Installs on first use, launches thereafter. Terminal=false on the .desktop for
      # the same reason as the Wine entry: fbappselect decides whether to wrap a command
      # in an xterm with `ldd | grep libX11`, and a shell script reports none.
      #
      # On a non-persistent boot the install lands in RAM and must be repeated every
      # boot; on a persistent USB it happens once. That is the clearest demonstration of
      # what persistence is for, and INSTALL.md leans on it.
      - dest: /usr/local/bin/notepadpp
        mode: "0755"
        content: |
          #!/bin/sh
          # Launch Notepad++, installing it into the Wine prefix the first time.
          # The prefix itself is created implicitly by the first `wine` call (~10-30 s).
          [ -r /etc/profile.d/wine.sh ] && . /etc/profile.d/wine.sh
          NPP="$HOME/.wine/drive_c/Program Files/Notepad++/notepad++.exe"
          # A 32-bit prefix has one Program Files, not a (x86) variant, so this path is
          # predictable. The guard means a cancelled install does not loop.
          #
          # "$@" goes to the EDITOR, never to the installer. Passing it to the installer
          # handed an NSIS setup a filename as a command-line switch and then launched
          # Notepad++ with no arguments, so `notepadpp file.txt` never opened file.txt --
          # on the first run or any later one.
          if [ ! -f "$NPP" ]; then
              wine /opt/notepadpp/npp-installer.exe
          fi
          # Report failure somewhere a user can SEE it. The .desktop entry sets
          # Terminal=false, so a bare `exit 1` is completely silent -- a cancelled or
          # failed install looked identical to nothing happening. xmessage is in the
          # base image (03-desktop.sb ships usr/bin/xmessage); the guard keeps the
          # wrapper usable from a plain console too.
          if [ ! -f "$NPP" ]; then
              msg="Notepad++ is not installed: the installer was cancelled or failed.
          Run it again to retry."
              echo "notepadpp: $msg" >&2
              if command -v xmessage >/dev/null 2>&1; then
                  xmessage -center "$msg" 2>/dev/null || true
              fi
              exit 1
          fi
          exec wine "$NPP" "$@"

      # Icon= IS AN ABSOLUTE PATH, for the same reason as 21-wine-desktop's launcher.
      # xlunch_genquick:34-46 searches only numeric size directories under
      # hicolor/pixmaps/icons-gnome and only ever appends ".png". The only
      # accessories-text-editor icon in the union lives under
      # /usr/share/icons/Adwaita/*/legacy/ -- wrong theme, wrong path shape -- so a bare
      # `Icon=accessories-text-editor` matched none of the 36 candidates and :52's
      # `if [ -e "$Icon" ]` dropped this entry entirely. Measured, not inferred.
      #
      # An absolute path is never reassigned by the search loop and reaches :52 intact.
      # This one is a real PNG, so unlike the Wine entry it does not depend on imlib2's
      # svg.so loader at all.
      - dest: /usr/share/applications/7notepadpp.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name=Notepad++
          GenericName=Text Editor
          Comment=Runs under Wine; installs itself on first use
          Exec=notepadpp
          TryExec=notepadpp
          Icon=/usr/share/icons/Adwaita/48x48/legacy/accessories-text-editor.png
          Terminal=false
          Categories=Utility;TextEditor;
